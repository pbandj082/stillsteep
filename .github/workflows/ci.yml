name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed app/lib packages
      - name: Analyze workspace
        run: flutter analyze --no-pub --fatal-infos

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned macOS app
        working-directory: app
        run: |
          flutter build macos --release --no-pub --config-only
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            build
